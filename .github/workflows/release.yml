name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  release:
    name: release
    environment: release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: latest
          package-manager-cache: false
          registry-url: "https://registry.npmjs.org"

      - name: Install and build
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm check

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      # the trusted publisher only accepts staged publishes, approve the release
      # under "Staged Packages" on npmjs.com
      - name: Stage publish
        run: pnpm stage publish --no-git-checks --provenance --access public
